name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate the CPU (Icarus Verilog) and lint it (Verilator)
        run: ./run.sh test
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the RTL to WebAssembly
        run: |
          docker build --target web -t verilog-cpu-web .
          mkdir -p site
          docker run --rm -v "$PWD/site:/out" verilog-cpu-web sh -c 'cp /site/* /out/'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publishes the board to GitHub Pages (enable once: Settings -> Pages -> Source: GitHub Actions)
    if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
